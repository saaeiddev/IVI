name: Verify IVI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download licensed GLB
        run: npm run assets
      - name: Verify simulation
        run: npm test
      - name: Compile and bundle
        run: npm run build
      - name: Check bundled model and entry point
        run: |
          test -s dist/assets/vehicle.glb
          test -s dist/index.html
          grep -q '/IVI/' dist/index.html
