name: Verify IVI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download licensed GLB
        run: npm run assets
      - name: Verify simulation
        run: npm test
      - name: Compile and bundle
        run: npm run build
      - name: Install browser for interaction checks
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile WebGL acceptance tests
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivi-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Check bundled model and entry point
        run: |
          test -s dist/assets/vehicle.glb
          test -s dist/index.html
          grep -q '/IVI/' dist/index.html
      - name: Verify live GitHub Pages and 3D model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 https://saaeiddev.github.io/IVI/ --output /tmp/ivi-live.html
          grep -q '/IVI/assets/' /tmp/ivi-live.html
          curl --fail --location --silent --show-error --retry 8 --retry-all-errors --retry-delay 10 --head https://saaeiddev.github.io/IVI/assets/vehicle.glb
          echo "Public site and licensed 3D asset respond successfully"
